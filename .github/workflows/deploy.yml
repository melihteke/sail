name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Tells the build where Pages serves the site: "/" with the custom domain,
      # "/sail" on melihteke.github.io before the domain is configured.
      - id: pages
        uses: actions/configure-pages@v6
      - name: Pass Pages URL to the build
        run: |
          echo "SITE_ORIGIN=${{ steps.pages.outputs.origin }}" >> "$GITHUB_ENV"
          echo "SITE_BASE_PATH=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"
      - uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
